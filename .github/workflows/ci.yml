name: CI

env:
  PUBLIC_APP_URL: http://localhost:4321
  PUBLIC_API_URL: http://localhost:8080

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build JS workspace
        run: pnpm build

      - name: Go Vet
        run: cd apps/api && go vet ./...

      - name: Go Test
        run: cd apps/api && go test ./...

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser-only E2E
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_API_SERVER: 1

  compliance:
    name: Release Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate FFmpeg asset
        run: pnpm --filter @aio-converter/web prebuild

      - name: Run compliance guardrail
        run: |
          set +e
          OUTPUT=$(pnpm compliance 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "blocked pending evidence"; then
              echo "::warning::FFmpeg provenance is blocked pending evidence. production/tagged release remains blocked."
              echo "### ⚠️ Release Blocked" >> $GITHUB_STEP_SUMMARY
              echo "FFmpeg provenance is blocked pending evidence. production/tagged release remains blocked." >> $GITHUB_STEP_SUMMARY
              exit 0
            else
              echo "::error::Real compliance failure detected."
              exit $EXIT_CODE
            fi
          fi
